<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Fitness — Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 450px;
      background: linear-gradient(180deg, rgba(160, 24, 24, 0.015), rgba(255,255,255,0.008));
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }
    
    .login-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,246,255,0.05), rgba(166,79,248,0.05));
      border-radius: 12px;
      pointer-events: none;
      animation: neonPulse 3s ease-in-out infinite;
    }
    
    @keyframes neonPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    
    .login-container h1 {
      color: #00f6ff;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      text-shadow: 0 0 10px rgba(0,246,255,0.5);
      position: relative;
      z-index: 1;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }
    
    .form-group label {
      display: block;
      color: #95a5a6;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,246,255,0.2);
      border-radius: 8px;
      color: #e6feff;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #00f6ff;
      box-shadow: 0 0 15px rgba(0,246,255,0.3);
      background: rgba(0,0,0,0.5);
    }
    
    .form-group input::placeholder {
      color: #666;
    }
    
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f6ff 0%, #a64ff8 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,246,255,0.4);
      position: relative;
      z-index: 1;
    }
    
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,246,255,0.6);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }
    
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .error-message {
      margin-top: 15px;
      padding: 12px;
      background: rgba(255,0,0,0.1);
      border: 1px solid rgba(255,0,0,0.3);
      border-radius: 8px;
      color: #ff6b6b;
      text-align: center;
      display: none;
      position: relative;
      z-index: 1;
    }
    
    .error-message.show {
      display: block;
      animation: shake 0.5s;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    .register-link {
      margin-top: 20px;
      text-align: center;
      color: #95a5a6;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }
    
    .register-link a {
      color: #00f6ff;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .register-link a:hover {
      color: #a64ff8;
      text-shadow: 0 0 5px rgba(166,79,248,0.5);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>AI Fitness Coach</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Login</button>
      <div class="error-message" id="errorMessage"></div>
      <div class="register-link">
        Don't have an account? <a href="#" id="registerLink">Register here</a>
      </div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const registerLink = document.getElementById('registerLink');

    // Check if already logged in - validate token first to avoid redirect loops
    const token = localStorage.getItem('jwt_token');
    if (token && token.trim() !== '') {
      // Validate token by making a test request instead of blindly redirecting
      fetch('/api/history', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      }).then(response => {
        if (response.ok) {
          // Token is valid, redirect to home
          window.location.replace('/');
        } else {
          // Token is invalid, remove it and stay on login page
          localStorage.removeItem('jwt_token');
        }
      }).catch(() => {
        // Network error or other issue, stay on login page
        localStorage.removeItem('jwt_token');
      });
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('Please enter both username and password');
        return;
      }
      
      // Disable button and show loading state
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      errorMessage.classList.remove('show');
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }
        
        if (data.access_token) {
          // Save token to localStorage
          localStorage.setItem('jwt_token', data.access_token);
          
          // Redirect to dashboard using replace to avoid history issues
          window.location.replace('/');
        } else {
          throw new Error('No access token received');
        }
      } catch (error) {
        showError(error.message || 'Login failed. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });

    // Register link handler
    registerLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('Please enter both username and password to register');
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Registering...';
      errorMessage.classList.remove('show');
      
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }
        
        if (data.access_token) {
          localStorage.setItem('jwt_token', data.access_token);
          window.location.replace('/');
        } else {
          throw new Error('No access token received');
        }
      } catch (error) {
        showError(error.message || 'Registration failed. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }
  </script>
</body>
</html>
